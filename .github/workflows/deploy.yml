name: Deploy All Assignments to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Assignment 4
        run: |
          cd Assignment_04_ProfileCard
          npm ci
          npm run build

      - name: Build Assignment 5
        run: |
          cd Assignment_05_ControlledForm
          npm ci
          npm run build

      - name: Build Assignment 6
        run: |
          cd Assignment_06_Counter
          npm ci
          npm run build

      - name: Assemble website
        run: |
          mkdir -p _site

          cp -r Assignment_01_Calculator _site/
          cp -r Assignment_02_ToDoList _site/
          cp -r Assignment_03_FormValidation _site/

          mkdir -p _site/Assignment_04_ProfileCard
          mkdir -p _site/Assignment_05_ControlledForm
          mkdir -p _site/Assignment_06_Counter

          cp -r Assignment_04_ProfileCard/dist/. _site/Assignment_04_ProfileCard/
          cp -r Assignment_05_ControlledForm/dist/. _site/Assignment_05_ControlledForm/
          cp -r Assignment_06_Counter/dist/. _site/Assignment_06_Counter/

          cp index.html _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4